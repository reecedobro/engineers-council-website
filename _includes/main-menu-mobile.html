<div id="main-menu-mobile" class="main-menu-mobile">
  {% assign mainmenu = site.data.menus.main | sort: 'weight' %}
  <ul>
    {% for item in mainmenu %}
      <li class="{% if item.url == page.url %}active{% endif %}{% if item.submenu %} has-dropdown{% endif %}">
        
        {% if item.submenu %}
          <button class="mobile-dropdown-toggle" type="button">
            {{ item.name }}
            <span class="dropdown-arrow">▾</span>
          </button>

          <ul class="mobile-dropdown-menu">
            {% for subitem in item.submenu %}
              <li class="{% if subitem.url == page.url %}active{% endif %}">
                <a href="{{ subitem.url | relative_url }}">{{ subitem.name }}</a>
              </li>
            {% endfor %}
          </ul>

        {% else %}
          <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
        {% endif %}

      </li>
    {% endfor %}
  </ul>
</div>
